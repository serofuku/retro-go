name: Build Retro-Go ESP32-S3 N16R8

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build:
    name: Build ESP32-S3 N16R8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ROM directory
        run: |
          echo "=== ROM directory ==="

          if [ ! -d "roms/gbc" ]; then
            echo "ERROR: roms/gbc directory does not exist"
            exit 1
          fi

          if ! find roms/gbc -maxdepth 1 -type f -iname "*.gbc" | grep -q .; then
            echo "ERROR: No .gbc ROM found in roms/gbc/"
            exit 1
          fi

          find roms/gbc -maxdepth 1 -type f -iname "*.gbc" -print

      - name: Check Python syntax
        run: |
          python3 -m py_compile rg_tool.py

      - name: Build Retro-Go Docker image
        run: |
          docker build \
            --tag retro-go-n16r8:latest \
            .

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Extract firmware image
        run: |
          CONTAINER=$(docker create retro-go-n16r8:latest)

          docker cp \
            "$CONTAINER:/app/." \
            output/

          docker rm "$CONTAINER"

      - name: Show generated files
        run: |
          echo "=== Build output ==="
          ls -lah output/

      - name: Verify final firmware
        run: |
          IMG=$(find output -maxdepth 1 -type f -name "*.img" | head -n 1)

          if [ -z "$IMG" ]; then
            echo "ERROR: No .img firmware was produced"
            exit 1
          fi

          SIZE=$(stat -c%s "$IMG")

          echo "Firmware: $IMG"
          echo "Size: $SIZE bytes"
          echo "Size: $(numfmt --to=iec "$SIZE")"

          if [ "$SIZE" -gt 16777216 ]; then
            echo "ERROR: Firmware is larger than 16 MB"
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Retro-Go-ESP32-S3-N16R8
          path: |
            output/*.img
          if-no-files-found: error
