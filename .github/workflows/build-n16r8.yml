name: Build Retro-Go ESP32-S3 N16R8

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build:
    name: Build ESP32-S3 N16R8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ROM directory
        run: |
          echo "=== ROM directory ==="

          if [ ! -d "roms/gbc" ]; then
            echo "ERROR: roms/gbc directory does not exist"
            exit 1
          fi

          ROM_COUNT=$(find roms/gbc -maxdepth 1 -type f -iname "*.gbc" | wc -l)

          if [ "$ROM_COUNT" -eq 0 ]; then
            echo "ERROR: No .gbc ROM found in roms/gbc/"
            exit 1
          fi

          echo "Found $ROM_COUNT GBC ROM(s):"
          find roms/gbc -maxdepth 1 -type f -iname "*.gbc" -print

      - name: Check Python syntax
        run: |
          python3 -m py_compile rg_tool.py

      - name: Build Retro-Go Docker image
        run: |
          docker build \
            --tag retro-go-n16r8:latest \
            .

      - name: Create output directory
        run: |
          rm -rf output
          mkdir -p output

      - name: Extract firmware image
        run: |
          echo "=== Creating build container ==="

          CONTAINER=$(docker create retro-go-n16r8:latest)

          echo "Container: $CONTAINER"

          echo "=== Extracting build files ==="

          docker cp \
            "$CONTAINER:/app/." \
            output/

          docker rm "$CONTAINER"

      - name: Show generated files
        run: |
          echo "=== Build output ==="
          ls -lah output/

          echo
          echo "=== IMG files ==="
          find output -maxdepth 1 -type f -name "*.img" -print

      - name: Verify final firmware
        run: |
          echo "=== Verifying firmware ==="

          IMG_COUNT=$(find output -maxdepth 1 -type f -name "*.img" | wc -l)

          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "ERROR: No .img firmware was produced"
            echo
            echo "Files found in output:"
            find output -maxdepth 1 -type f -printf "%f\n"
            exit 1
          fi

          if [ "$IMG_COUNT" -gt 1 ]; then
            echo "WARNING: Multiple .img files were produced:"
            find output -maxdepth 1 -type f -name "*.img" -print
          fi

          IMG=$(find output -maxdepth 1 -type f -name "*.img" | head -n 1)

          SIZE=$(stat -c%s "$IMG")

          echo "Firmware: $IMG"
          echo "Size: $SIZE bytes"
          echo "Size: $(numfmt --to=iec "$SIZE")"

          if [ "$SIZE" -gt 16777216 ]; then
            echo
            echo "ERROR: Firmware is larger than 16 MB"
            echo "ESP32-S3 N16R8 has 16 MB flash."
            exit 1
          fi

          echo
          echo "Firmware is within the 16 MB flash limit."

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Retro-Go-ESP32-S3-N16R8
          path: |
            output/*.img
          if-no-files-found: error
